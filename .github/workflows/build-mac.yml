name: Build macOS VST3/AU

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer JUCE (un niveau au-dessus du repo, comme en local)
        run: |
          cd ..
          git clone --depth 1 https://github.com/juce-framework/JUCE.git

      - name: Compiler Projucer
        run: |
          cd ../JUCE
          xcodebuild -project extras/Projucer/Builds/MacOSX/Projucer.xcodeproj -configuration Release

      - name: Définir le chemin global JUCE (fix bug Projucer CLI)
        run: |
          PROJUCER="../JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer"
          "$PROJUCER" --set-global-search-path osx defaultJuceModulePath "$(cd ../JUCE/modules && pwd)"

      - name: Générer le projet Xcode depuis Sixpack.jucer
        run: |
          ../JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer --resave "Sixpack.jucer"

      - name: Compiler le plugin (VST3)
        run: |
          xcodebuild -project "Builds/MacOSX/Sixpack.xcodeproj" -target "Sixpack - VST3" -configuration Release

      - name: Uploader le VST3
        uses: actions/upload-artifact@v4
        with:
          name: Sixpack-macOS-VST3
          path: "Builds/MacOSX/build/Release/Sixpack.vst3"

  build-dmg:
    needs: build-mac
    runs-on: macos-latest

    steps:
      - name: Récupérer le code (pour le Readme)
        uses: actions/checkout@v4

      - name: Télécharger le VST3
        uses: actions/download-artifact@v4
        with:
          name: Sixpack-macOS-VST3
          path: staging/Sixpack.vst3

      - name: Assembler le DMG
        run: |
          set -e
          cp Readme-osx.txt "staging/Readme.txt"

          # Raccourci glisser-déposer vers le dossier de plugins VST3 standard
          ln -s /Library/Audio/Plug-Ins/VST3 "staging/VST3 (drag plugin here)"

          hdiutil create -volname "Sixpack 1.16.1" \
            -srcfolder staging -ov -format UDZO \
            "Sixpack-1.16.1.dmg"

      - name: Uploader le DMG
        uses: actions/upload-artifact@v4
        with:
          name: Sixpack-1.16.1-DMG
          path: "Sixpack-1.16.1.dmg"
