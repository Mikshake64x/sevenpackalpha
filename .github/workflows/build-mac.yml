name: Build macOS VST3 + Standalone (DMG + PKG)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# UN SEUL job (2026-11-13) : compilation, DMG et PKG sur la meme machine.
# Avant, le DMG et le PKG etaient deux jobs separes qui devaient chacun obtenir
# une nouvelle machine macOS : le run #9 a echoue sur "The job was not
# acquired by Runner of type hosted even after multiple attempts" (manque de
# machines macOS arm64 chez GitHub), alors que la compilation avait reussi.
# Une seule machine a obtenir par build, et plus d'aller-retour d'artefacts
# (qui perdaient en plus le bit executable des bundles).
jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Version figee a 8.0.10 (pas "latest") : JUCE 9.0.1 introduit une
      # regression confirmee sur Windows (fenetre d'editeur VST3 detruite
      # et jamais reconstruite au passage sur un ecran a DPI different sous
      # Ableton -- diagnostique via repro utilisateur, cf. historique du
      # projet). Pas verifie comme affectant macOS specifiquement, mais on
      # garde la meme version partout plutot que de decouvrir une seconde
      # regression plus tard sur cette plateforme aussi.
      - name: Récupérer JUCE 8.0.10 (un niveau au-dessus du repo, comme en local)
        run: |
          cd ..
          git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git

      - name: Compiler Projucer
        run: |
          cd ../JUCE
          xcodebuild -project extras/Projucer/Builds/MacOSX/Projucer.xcodeproj -configuration Release

      - name: Définir le chemin global JUCE (fix bug Projucer CLI)
        run: |
          PROJUCER="../JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer"
          "$PROJUCER" --set-global-search-path osx defaultJuceModulePath "$(cd ../JUCE/modules && pwd)"

      - name: Générer le projet Xcode depuis SevenpackAlpha.jucer
        run: |
          ../JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer --resave "SevenpackAlpha.jucer"

      # Binaires universels (Apple Silicon + Intel).
      - name: Compiler le plugin (VST3)
        run: |
          xcodebuild -project "Builds/MacOSX/SevenpackAlpha.xcodeproj" -target "SevenpackAlpha - VST3" \
            -configuration Release ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO

      - name: Compiler l'application (Standalone)
        run: |
          xcodebuild -project "Builds/MacOSX/SevenpackAlpha.xcodeproj" -target "SevenpackAlpha - Standalone Plugin" \
            -configuration Release ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO

      # La version vient du .jucer ; l'etiquette (ex. "beta") de
      # Source/BuildLabel.h s'ajoute aux noms de fichiers. VERSION reste
      # numerique pour pkgbuild.
      - name: Version et etiquette
        run: |
          set -e
          # Ligne 1 sautee : c'est la declaration XML (<?xml version="1.0" ...>).
          VERSION=$(tail -n +2 SevenpackAlpha.jucer | grep -o 'version="[0-9.]*"' | head -1 | cut -d'"' -f2)
          LABEL=$(grep '^#define SEVENPACK_BUILD_LABEL' Source/BuildLabel.h | cut -d'"' -f2)
          NAME="$VERSION"
          DISP="$VERSION"
          if [ -n "$LABEL" ]; then NAME="$VERSION-$LABEL"; DISP="$VERSION $LABEL"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "DISPLAY_VERSION=$DISP" >> "$GITHUB_ENV"
          echo "::notice::Version $DISP"

      - name: Assembler le DMG
        run: |
          set -e
          trap 'echo "::error::DMG : echec ligne $LINENO : $BASH_COMMAND"' ERR
          OUT="Builds/MacOSX/build/Release"
          mkdir -p staging
          # ditto : copie fidele des bundles (liens, droits d'execution).
          ditto "$OUT/SevenpackAlpha.vst3" "staging/SevenpackAlpha.vst3"
          ditto "$OUT/SevenpackAlpha.app" "staging/SevenpackAlpha.app"
          cp Readme-osx.txt "staging/Readme.txt"

          # Raccourcis glisser-deposer : dossier VST3 standard et Applications.
          ln -s /Library/Audio/Plug-Ins/VST3 "staging/VST3 (drag plugin here)"
          ln -s /Applications "staging/Applications (drag app here)"

          hdiutil create -volname "Sevenpack Alpha $DISPLAY_VERSION" \
            -srcfolder staging -ov -format UDZO \
            "SevenpackAlpha-$NAME.dmg"

      # Installeur .pkg (demande explicite : "render mac en pkg avec le vst, et
      # le standalone") : 2 composants coches par defaut, "Customize" pour n'en
      # garder qu'un (installer-mac/distribution.xml). Les fichiers poses par
      # Installer n'ont pas l'attribut de quarantaine : le plugin se charge sans
      # "Open Anyway". Le .pkg n'est pas signe (pas de Developer ID) : seul son
      # premier lancement demande Reglages > Confidentialite et securite.
      # Les "::notice::" / "::error::" sont des annotations du run, lisibles
      # sans compte (contrairement au journal) : diagnostic en cas d'echec.
      - name: Assembler le PKG
        run: |
          set -e
          trap 'echo "::error::PKG : echec ligne $LINENO : $BASH_COMMAND"' ERR
          OUT="Builds/MacOSX/build/Release"
          mkdir -p pkgroot/vst3/Library/Audio/Plug-Ins/VST3 pkgroot/app/Applications
          ditto "$OUT/SevenpackAlpha.vst3" "pkgroot/vst3/Library/Audio/Plug-Ins/VST3/SevenpackAlpha.vst3"
          ditto "$OUT/SevenpackAlpha.app" "pkgroot/app/Applications/SevenpackAlpha.app"

          # Bundles NON relocalisables : sinon Installer "suit" une autre copie
          # du meme bundle ailleurs sur le disque et installe la-bas.
          for part in vst3 app; do
            pkgbuild --analyze --root "pkgroot/$part" "$part.plist"
            i=0
            while /usr/libexec/PlistBuddy -c "Print :$i" "$part.plist" >/dev/null 2>&1; do
              # La cle n'existe pas pour tous les bundles (ex. .vst3) : on la
              # retire si elle est la, puis on la cree a false.
              /usr/libexec/PlistBuddy -c "Delete :$i:BundleIsRelocatable" "$part.plist" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Add :$i:BundleIsRelocatable bool false" "$part.plist"
              i=$((i+1))
            done
            echo "::notice::$part : $i bundle(s) non relocalisable(s)"
          done

          pkgbuild --root pkgroot/vst3 --component-plist vst3.plist --install-location / \
            --identifier com.SideKeySystem.SevenpackAlpha.vst3.pkg --version "$VERSION" SevenpackAlpha-VST3.pkg
          pkgbuild --root pkgroot/app --component-plist app.plist --install-location / \
            --identifier com.SideKeySystem.SevenpackAlpha.app.pkg --version "$VERSION" SevenpackAlpha-App.pkg

          mkdir -p pkgres
          cp installer-mac/Readme.txt pkgres/Readme.txt
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@DISPLAY_VERSION@/$DISPLAY_VERSION/g" installer-mac/distribution.xml > distribution.xml
          productbuild --distribution distribution.xml --package-path . --resources pkgres \
            "SevenpackAlpha-$NAME.pkg"

          # Controle (sans tube vers head : le shell des Actions est en
          # pipefail, un SIGPIPE ferait echouer l'etape).
          pkgutil --payload-files SevenpackAlpha-VST3.pkg > vst3-files.txt
          pkgutil --payload-files SevenpackAlpha-App.pkg > app-files.txt
          echo "::notice::PKG $NAME : VST3 $(wc -l < vst3-files.txt | tr -d ' ') fichiers, App $(wc -l < app-files.txt | tr -d ' ') fichiers, $(du -h "SevenpackAlpha-$NAME.pkg" | cut -f1)"

      - name: Uploader le PKG
        uses: actions/upload-artifact@v4
        with:
          name: SevenpackAlpha-${{ env.NAME }}-PKG
          path: "SevenpackAlpha-${{ env.NAME }}.pkg"

      - name: Uploader le DMG
        uses: actions/upload-artifact@v4
        with:
          name: SevenpackAlpha-${{ env.NAME }}-DMG
          path: "SevenpackAlpha-${{ env.NAME }}.dmg"
