name: Build macOS VST3 + Standalone (DMG)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Version figee a 8.0.10 (pas "latest") : JUCE 9.0.1 introduit une
      # regression confirmee sur Windows (fenetre d'editeur VST3 detruite
      # et jamais reconstruite au passage sur un ecran a DPI different sous
      # Ableton -- diagnostique via repro utilisateur, cf. historique du
      # projet). Pas verifie comme affectant macOS specifiquement, mais on
      # garde la meme version partout plutot que de decouvrir une seconde
      # regression plus tard sur cette plateforme aussi.
      - name: Récupérer JUCE 8.0.10 (un niveau au-dessus du repo, comme en local)
        run: |
          cd ..
          git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git

      - name: Compiler Projucer
        run: |
          cd ../JUCE
          xcodebuild -project extras/Projucer/Builds/MacOSX/Projucer.xcodeproj -configuration Release

      - name: Définir le chemin global JUCE (fix bug Projucer CLI)
        run: |
          PROJUCER="../JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer"
          "$PROJUCER" --set-global-search-path osx defaultJuceModulePath "$(cd ../JUCE/modules && pwd)"

      - name: Générer le projet Xcode depuis SevenpackAlpha.jucer
        run: |
          ../JUCE/extras/Projucer/Builds/MacOSX/build/Release/Projucer.app/Contents/MacOS/Projucer --resave "SevenpackAlpha.jucer"

      # Binaires universels (Apple Silicon + Intel).
      - name: Compiler le plugin (VST3)
        run: |
          xcodebuild -project "Builds/MacOSX/SevenpackAlpha.xcodeproj" -target "SevenpackAlpha - VST3" \
            -configuration Release ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO

      - name: Compiler l'application (Standalone)
        run: |
          xcodebuild -project "Builds/MacOSX/SevenpackAlpha.xcodeproj" -target "SevenpackAlpha - Standalone Plugin" \
            -configuration Release ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO

      - name: Uploader le VST3
        uses: actions/upload-artifact@v4
        with:
          name: SevenpackAlpha-macOS-VST3
          path: "Builds/MacOSX/build/Release/SevenpackAlpha.vst3"

      - name: Uploader le Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SevenpackAlpha-macOS-Standalone
          path: "Builds/MacOSX/build/Release/SevenpackAlpha.app"

  build-dmg:
    needs: build-mac
    runs-on: macos-latest

    steps:
      - name: Récupérer le code (pour le Readme et la version)
        uses: actions/checkout@v4

      - name: Télécharger le VST3
        uses: actions/download-artifact@v4
        with:
          name: SevenpackAlpha-macOS-VST3
          path: staging/SevenpackAlpha.vst3

      - name: Télécharger le Standalone
        uses: actions/download-artifact@v4
        with:
          name: SevenpackAlpha-macOS-Standalone
          path: staging/SevenpackAlpha.app

      # La version vient du .jucer (plus de numero a recopier ici).
      - name: Assembler le DMG
        run: |
          set -e
          # Ligne 1 sautee : c'est la declaration XML (<?xml version="1.0" ...>).
          VERSION=$(tail -n +2 SevenpackAlpha.jucer | grep -o 'version="[0-9.]*"' | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Les artefacts perdent le bit executable : on le remet.
          chmod +x "staging/SevenpackAlpha.app/Contents/MacOS/"* || true
          chmod +x "staging/SevenpackAlpha.vst3/Contents/MacOS/"* || true

          cp Readme-osx.txt "staging/Readme.txt"

          # Raccourcis glisser-deposer : dossier VST3 standard et Applications.
          ln -s /Library/Audio/Plug-Ins/VST3 "staging/VST3 (drag plugin here)"
          ln -s /Applications "staging/Applications (drag app here)"

          hdiutil create -volname "Sevenpack Alpha $VERSION" \
            -srcfolder staging -ov -format UDZO \
            "SevenpackAlpha-$VERSION.dmg"

      - name: Uploader le DMG
        uses: actions/upload-artifact@v4
        with:
          name: SevenpackAlpha-${{ env.VERSION }}-DMG
          path: "SevenpackAlpha-${{ env.VERSION }}.dmg"
